name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Swift sources
        run: ./scripts/swift.sh build 2>&1 | tee build.log
      - name: Fetch and verify pinned engine for runtime tests
        run: ./scripts/fetch-engine.sh 2>&1 | tee fetch-engine.log
      - name: Run Swift tests
        run: ./scripts/swift.sh test 2>&1 | tee tests.log
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-logs
          path: |
            build.log
            fetch-engine.log
            tests.log
          retention-days: 7

  engine-integration:
    name: Engine Integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch and verify pinned engine
        run: ./scripts/fetch-engine.sh 2>&1 | tee fetch-engine.log
      - name: Test capture
        run: python3 scripts/smoke-engine.py --count 100 2>&1 | tee smoke-engine.log
      - name: Test Map Local and breakpoints
        run: python3 scripts/smoke-rules.py 2>&1 | tee smoke-rules.log
      - name: Test LAN device approval
        run: python3 scripts/smoke-lan-devices.py 2>&1 | tee smoke-lan-devices.log
      - name: Test selective HTTPS decryption
        run: python3 scripts/smoke-https-decryption.py 2>&1 | tee smoke-https.log
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-integration-logs
          path: |
            *.log
            .cache/engine-baseline.json
          include-hidden-files: true
          retention-days: 7

  package:
    name: Package Verification
    if: github.event_name != 'pull_request'
    needs: [build-test, engine-integration]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify engine source archives
        run: python3 scripts/verify-engine-sources.py
      - name: Build application
        run: ./scripts/build-app.sh 2>&1 | tee package.log
      - name: Check release tag matches application version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Reqnivo.app/Contents/Info.plist)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match application version v$version" >&2
            exit 1
          fi
      - name: Package and verify ZIP
        run: ./scripts/verify-app-package.sh
      - name: Package and verify companion engine sources
        if: github.ref_type == 'tag'
        run: |
          archive="$PWD/dist/ci/Reqnivo-engine-source-12.2.3.zip"
          git archive --format=zip --output="$archive" HEAD \
            LICENSE THIRD_PARTY_NOTICES.md docs/ENGINE_SOURCE.md docs/PUBLIC_RELEASE_REVIEW.md \
            scripts/rebuild-engine.sh scripts/verify-engine-sources.py vendor/third-party
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          unzip -q "$archive" -d "$temporary"
          python3 "$temporary/scripts/verify-engine-sources.py"
          cd dist/ci
          shasum -a 256 Reqnivo-engine-source-12.2.3.zip >> SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Reqnivo-macOS-arm64-${{ github.sha }}
          path: |
            dist/ci/*.zip
            dist/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-log
          path: package.log
          retention-days: 7

  release:
    name: Draft Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Reqnivo-macOS-arm64-${{ github.sha }}
          path: release-assets
      - name: Verify downloaded checksums
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS.txt
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
            --verify-tag --draft --prerelease --title "Reqnivo $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md --generate-notes
